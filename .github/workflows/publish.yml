name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Fetch the published page
        run: |
          set -euo pipefail
          mkdir -p site
          curl -fsSL --retry 3 --retry-delay 5 --max-time 90 "https://4m7n77fdn407v.doubao.link/app/app_17j194ha0q1" -o site/index.html
          echo "bytes: $(wc -c < site/index.html)"
          grep -q "\u6d77\u6d3d\u676f" site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
